variables:
  KANIKO_REGISTRY_TAG: latest
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:debug
  KANIKO_SOURCE_CODE_PATH: .
  KANIKO_DOCKER_FILE: $KANIKO_SOURCE_CODE_PATH/Dockerfile
  KANIKO_REGISTRY_NAME: $CI_REGISTRY_IMAGE
  KANIKO_REGISTRY_IMAGE: $KANIKO_REGISTRY_NAME:$KANIKO_REGISTRY_TAG
  KANIKO_BUILD_ARGS: ""

kaniko:
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  stage: build
  before_script:
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      if [[ ! -f "$kaniko_config_file" ]]; then
      echo "No $kaniko_config_file found! Creating one now."
      cat << END_CONFIGS >> $kaniko_config_file
      {
        "auths" : {
          "${CI_REGISTRY}": {
            "auth": "$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
          },
          "$CI_DEPENDENCY_PROXY_SERVER": {
            "auth": "$(printf "%s:%s" ${CI_DEPENDENCY_PROXY_USER} "${CI_DEPENDENCY_PROXY_PASSWORD}" | base64 | tr -d '\n')"
          }
        }
      }
      END_CONFIGS
      fi
  script:
    - |
      if echo $CI_COMMIT_TAG | grep -Eq 'v[0-9]+(\.[0-9]+){2}$'; then
        DESTINATIONS="--destination $KANIKO_REGISTRY_NAME:$CI_COMMIT_TAG --destination $KANIKO_REGISTRY_NAME:latest"
      fi

    - /kaniko/executor
      --context "$KANIKO_SOURCE_CODE_PATH"
      --dockerfile "$KANIKO_DOCKER_FILE"
      --destination "$KANIKO_REGISTRY_IMAGE"
      $DESTINATIONS
      $KANIKO_BUILD_ARGS
  after_script:
    - rm -f /kaniko/.docker/config.json
