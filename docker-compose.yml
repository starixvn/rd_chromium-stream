services:
  chromium:
    image: ghcr.io/browserless/chromium
    ports:
      - "3000:3000"
    environment:
      - CONCURRENT=10
      - TOKEN=token
      - TIMEOUT=0
  stream:
    build:
      dockerfile: cdn.Dockerfile
    environment:
      - STREAM_FROM=https://www.youtube.com/embed/qZcSgGQc4-I?autoplay=1
      - BROWSER_WS_ENDPOINT=ws://chromium:3000
      - USE_GPU=false
      - BROWSER_TOKEN=token
    ports:
      - "9999:5000"
    volumes:
      - ./hls:/app/hls
      - ./src:/app/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
