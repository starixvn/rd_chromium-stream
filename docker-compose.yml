services:
  chromium:
    image: ghcr.io/browserless/chromium
    ports:
      - "3000:3000"
    environment:
      - CONCURRENT=10
      - TOKEN=token
      - TIMEOUT=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  stream:
    build:
      dockerfile: Dockerfile
    environment:
      - STREAM_FROM=https://www.youtube.com/embed/qZcSgGQc4-I?autoplay=1
      - BROWSER_ENDPOINT=ws://chromium:3000
      - BROWSER_TOKEN=token
      - FFMPEG_GPU=false
    ports:
      - "9999:3000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
