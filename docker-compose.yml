services:
  chromium:
    build:
      dockerfile: chromium.Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["video","compute","utility"]
  stream:
    build:
      dockerfile: dev.Dockerfile
    command: sleep infinity
    environment:
      - STREAM_FROM=https://www.youtube.com/embed/qZcSgGQc4-I?autoplay=1
      - BROWSER_ENDPOINT=ws://chromium:3000
      - BROWSER_TOKEN=rd
      - FFMPEG_GPU=true
    ports:
      - "9999:5000"
    volumes:
      - ./:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["video","compute","utility"]
