services:
  nginx:
    image: alfg/nginx-rtmp
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template
  stream:
    build: .
    environment:
      - STREAM_FROM=https://www.youtube.com/embed/cqPosRZsw_o?autoplay=1
      - STREAM_TO=rtmp://nginx:1935/stream/test
      - SCREEN_WIDTH=854
      - SCREEN_HEIGHT=480
