services:
  chromium:
    image: ghcr.io/browserless/chromium
    ports:
      - "3000:3000"
    environment:
      - CONCURRENT=10
      - TOKEN=token
      - TIMEOUT=86400000
  nginx:
    image: nginx
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - hls:/hls
  stream:
    build: .
    environment:
      - STREAM_FROM=https://www.youtube.com/embed/qZcSgGQc4-I?autoplay=1
    volumes:
      - hls:/app/hls
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hls:
